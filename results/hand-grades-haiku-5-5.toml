[[reply]]
n = 1
question = "q28"
repeat = 3
asked = "There's a dust haze warning for Kano tomorrow. Can I move my flight without paying?"
expected = "10 days or ten days, opening with yes"
reply = "Yes, if the Nigerian Meteorological Agency has issued a dust haze advisory for Kano, Zuma Air's harmattan rule lets you rebook at no cost to any date within 10 days, whatever your fare family. When the Nigerian Meteorological Agency issues a dust haze advisory for your departure or arrival airport, you can move your flight free of charge to any date within 10 days, on any fare family. Make sure the advisory covers the airport you depart from or arrive at."
mark = "R"
why = "Opens with 'Yes' and contains '10 days', so both parts of expected are met. It is repetitive and conditional on the advisory, but nothing contradicts expected."

