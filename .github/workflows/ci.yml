name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked fails if uv.lock is out of date, so CI installs exactly what was tested.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No test may reach the network: no key, no cost.
      - run: uv run pytest
