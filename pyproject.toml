[project]
name = "disease-division"
version = "0.1.0"
description = "A question-answering system I attack on purpose, then defend, with every result checked by code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Search by meaning: FastEmbed runs the embedding model on ONNX Runtime, without PyTorch
    "fastembed>=0.9",
    # The store: Postgres through psycopg 3, with pgvector's types registered on each connection
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    # The librarian: Claude, through Anthropic's own SDK. Only the paid commands use it
    "anthropic>=2.12",
]

[project.scripts]
division = "disease_division.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disease_division"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
