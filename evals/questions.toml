# The golden set for The Disease Division.
#
# Written before any search or model has run. Card D2 freezes this file with an md5,
# and from then on it is never edited after seeing results.
#
# kind = "answerable": a public page holds the answer.
# kind = "staff_only": only a staff-only page holds it, so a public asker should not get it.
# kind = "no_answer": nothing in the stacks answers it; `absent` lists words that prove it.
#
# `evidence` is copied word for word from the page named in `doc`. Every fact in `answer`
# must appear in it; " | " separates ways of writing the same fact.

[[question]]
id = "q01"
kind = "answerable"
question = "I booked a Savanna fare and need to move my flight to next week. How much is the change fee?"
doc = "changing-a-flight"
evidence = "A change on a Savanna fare costs NGN 9,000 per passenger per flight, plus any difference in fare."
answer = ["9,000"]

