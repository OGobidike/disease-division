# Practice questions for the pilot. These are not part of the golden set.
#
# The pilot sends these 20 questions to the model before the golden run, to measure how many
# tokens a real call takes and to see real replies (refusals included). If the pilot shows
# something broken, it can be fixed here without anyone having seen a golden question answered.
# None of them shares a question, a fact or an answering passage with a golden question;
# tests/test_pilot.py checks that. (Search may still show a practice question a passage that
# answers a golden one, as it can for any question.)
#
# The format is the golden set's, and the same checks apply (division shelf runs them).

[[question]]
id = "p01"
kind = "answerable"
question = "Do I get anything free to drink on a long flight?"
doc = "food-and-drink"
evidence = "On flights longer than 90 minutes, every passenger gets a free soft drink and a snack."
answer = ["soft drink"]

[[question]]
id = "p02"
kind = "answerable"
question = "How heavy can my cabin bag be?"
doc = "cabin-baggage"
evidence = "The cabin bag must weigh no more than 7 kg and measure no more than 55 x 40 x 20 cm, including wheels and handles."
answer = ["7 kg"]

[[question]]
id = "p03"
kind = "answerable"
question = "How many planes does Zuma Air fly?"
doc = "fleet"
evidence = "Zuma Air flies 12 aircraft"
answer = ["12 | twelve"]

[[question]]
id = "p04"
kind = "answerable"
question = "How much is the jollof rice on board?"
doc = "food-and-drink"
evidence = "A plate of jollof rice with chicken costs NGN 3,500."
answer = ["3,500"]

